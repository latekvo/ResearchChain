apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: summarizer
  name: summarizer
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: summarizer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (HEAD)
      labels:
        io.kompose.service: summarizer
    spec:
      containers:
        - image: summarizer
          name: summarizer
          volumeMounts:
            - mountPath: /app/store/vector
              name: shared-vector-store
      restartPolicy: Always
      volumes:
        - name: shared-vector-store
          persistentVolumeClaim:
            claimName: shared-vector-store
