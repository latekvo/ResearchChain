apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: ollama
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (HEAD)
      labels:
        io.kompose.service: ollama
    spec:
      containers:
        - command:
            - /usr/bin/bash
            - ./ollama/entrypoint.sh
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
          image: ollama/ollama
          name: ollama
          ports:
            - containerPort: 11434
              protocol: TCP
          tty: true
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama
            - mountPath: /ollama/entrypoint.sh
              name: ollama-cm1
              subPath: entrypoint.sh
      restartPolicy: Always
      volumes:
        - name: ollama
          persistentVolumeClaim:
            claimName: ollama
        - configMap:
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
            name: ollama-cm1
          name: ollama-cm1
